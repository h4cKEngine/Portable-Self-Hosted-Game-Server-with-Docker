services:
  restore-backup:
    image: restic-rclone
    build:
      context: ./images/restic-rclone
      dockerfile: restic-rclone.Dockerfile
    container_name: ${MC_CONTAINER_NAME}-restore-backup
    profiles: ["restore"]
    restart: "no"
    env_file: 
      - ./env/.env
    environment:
      RESTIC_HOSTNAME: ${RESTIC_HOSTNAME:-MinecraftServer}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RCLONE_CONFIG: ${RCLONE_CONFIG:-/etc/rclone/rclone.conf}
      MUTEX_REMOTE_DIR: ${MUTEX_REMOTE_DIR:-}
      XDG_CACHE_HOME: /data/.cache
    user: "${TARGET_UID:-1000}:${TARGET_GID:-1000}"
    volumes:
      - ./data:/data
      - ./env/rclone.conf:${RCLONE_CONFIG:-/etc/rclone/rclone.conf}:ro

  mc:
    image: minecraft-server
    container_name: ${MC_CONTAINER_NAME:-minecraft-server}
    build:
      context: ./images/minecraft-server/
      dockerfile: ${MC_DOCKERFILE:-mcserver.java21.Dockerfile}
    ports:
      - "25565:25565"
    stop_grace_period: 15m
    env_file:
      - ./env/.env
    environment:
      UID: ${TARGET_UID:-1000}
      GID: ${TARGET_GID:-1000}
      # === Server config ===
      VIEW_DISTANCE: ${VIEW_DISTANCE:-15}
      SIMULATION_DISTANCE: ${SIMULATION_DISTANCE:-5}
      IP_SERVER: ${IP_SERVER:-127.0.0.1}
      VERSION: ${VERSION:-1.21.1}
      TYPE: ${TYPE:-FORGE}
      FORGE_VERSION: ${FORGE_VERSION:-}
      NEOFORGE_VERSION: ${NEOFORGE_VERSION:-}
      FABRIC_LAUNCHER_VERSION: ${FABRIC_LAUNCHER_VERSION:-}
      FABRIC_LOADER_VERSION: ${FABRIC_LOADER_VERSION:-}
      INIT_MEMORY: ${INIT_MEMORY:-2G}
      MEMORY: ${MEMORY:-6G}
      MOTD: ${MOTD:-}
      MAX_PLAYERS: ${MAX_PLAYERS:-8}
      # SEED: ${SEED:-}
      OPERATORS: ${OPERATORS:-}
      REMOVE_OLD_MODS: "FALSE"
      ALLOW_FLIGHT: "TRUE"
      SPAWN_PROTECTION: 0
      EULA: "TRUE"
      ONLINE_MODE: "FALSE"
      JVM_OPTS: "-Dfml.queryResult=confirm"

      # === RCON & DDNS ===
      RCON_PASSWORD: ${RCON_PASSWORD:-minecraft}
      DDNS_PROVIDER: ${DDNS_PROVIDER:-}
      DDNS_DOMAIN: ${DDNS_DOMAIN:-}
      DDNS_TOKEN: ${DDNS_TOKEN:-}
      BACKUP: ${BACKUP:-true}

      # === Restic
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_TAG: ${RESTIC_TAG:-}
      RESTIC_KEEP_LAST: ${RESTIC_KEEP_LAST:-10}
      
      # === Auto/Sleep
      ENABLE_AUTOSTOP: ${ENABLE_AUTOSTOP:-}
      AUTOSTOP_TIMEOUT_EST: ${AUTOSTOP_TIMEOUT_EST:-3600}
      AUTOSTOP_TIMEOUT_INIT: ${AUTOSTOP_TIMEOUT_INIT:-1800}
      ENABLE_AUTOPAUSE: ${ENABLE_AUTOPAUSE:-}
      MAX_TICK_TIME: ${MAX_TICK_TIME:--1}
      PAUSE_WHEN_EMPTY_SECONDS: ${PAUSE_WHEN_EMPTY_SECONDS:-300}

      MUTEX_REMOTE_DIR: ${MUTEX_REMOTE_DIR:-}
    volumes:
      - ./data:/data
      - ./env/rclone.conf:${RCLONE_CONFIG:-/etc/rclone/rclone.conf}:ro
      - ./overrides:/overrides:ro

  backups:
    image: itzg/mc-backup
    container_name: ${MC_CONTAINER_NAME:-minecraft-server}-backup
    environment:
      UID: ${TARGET_UID:-1000}
      GID: ${TARGET_GID:-1000}
      RCON_HOST: mc
      RCON_PASSWORD: ${RCON_PASSWORD:-minecraft}
      RCON_RETRIES: -1
      RESTIC_HOSTNAME: ${RESTIC_HOSTNAME:-MinecraftServer}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RCLONE_CONFIG: ${RCLONE_CONFIG:-/etc/rclone/rclone.conf}
      BACKUP_INTERVAL: "30m"
      BACKUP_METHOD: restic
      SRC_DIR: /data/world
      INITIAL_DELAY: "60" # seconds
    stop_grace_period: 2m
    volumes:
      - ./data:/data:ro
      - ./env/rclone.conf:${RCLONE_CONFIG:-/etc/rclone/rclone.conf}:ro
      - ./backups:/backups

  web:
    build:
      context: ./images/caddy
      dockerfile: ${CADDY_DOCKERFILE:-web.Dockerfile}
      args:
        CADDY_DNS_PROVIDER: ${DDNS_PROVIDER_NAME:-duckdns}
    container_name: ${MC_CONTAINER_NAME:-minecraft-server}-web
    environment:
      DUCKDNS_TOKEN: ${DDNS_TOKEN:-}
      DDNS_DOMAIN: ${DDNS_DOMAIN:-}
      DDNS_PROVIDER: ${DDNS_PROVIDER:-}
      DDNS_PROVIDER_NAME: ${DDNS_PROVIDER_NAME:-duckdns}
      IP_SERVER: ${IP_SERVER:-127.0.0.1}
      MC_CONTAINER_NAME: ${MC_CONTAINER_NAME:-minecraft-server}
      MC_HOST: "mc"
      MC_PORT: "25565"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./images/caddy/web:/usr/share/caddy:ro
      - ./images/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./images/caddy/caddy_data:/data
      - ./images/caddy/caddy_config:/config
      - ./images/caddy/main.py:/app/main.py
      - ./env:/app/env
      - ./server_modpacks:/app/server_modpacks
      - ./data:/app/data
      - ./utils:/app/utils:ro
      - ./:/project
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
