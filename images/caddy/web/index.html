<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Server Status</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=5">
    <link rel="stylesheet" href="config.css?v=5">
</head>

<body>
    <div class="bg-particles" id="particles"></div>

    <!-- Navigation Header -->
    <nav class="top-nav">
        <div class="nav-brand">
            <span class="nav-icon">⛏️</span>
            <span class="nav-title">MC Server Control</span>
        </div>
        <div class="nav-links">
            <a href="index.html" class="nav-btn active">📊 Status Dashboard</a>
            <a href="config.html" class="nav-btn">⚙️ Server Configurator</a>
        </div>
    </nav>

    <main class="container">
        <header>
            <div class="logo">⛏️</div>
            <h1 id="server-name">Minecraft Server</h1>
            <p class="subtitle">Server Status Dashboard</p>
            <p class="visitor-greeting" id="visitor-greeting" style="display:none"></p>
        </header>

        <section class="status-card" id="status-card">
            <div class="status-badge" id="status-badge">
                <span class="pulse-dot" id="pulse-dot"></span>
                <span id="status-text">Checking...</span>
            </div>

            <div class="info-grid">
                <div class="info-item">
                    <div class="info-label">🌐 Address</div>
                    <div class="info-value" id="server-address">Loading...</div>
                </div>
                <div class="info-item">
                    <div class="info-label">📡 IP</div>
                    <div class="info-value" id="server-ip">Loading...</div>
                </div>
                <div class="info-item">
                    <div class="info-label">👥 Players</div>
                    <div class="info-value" id="player-count">—</div>
                </div>
                <div class="info-item">
                    <div class="info-label">🗺️ Version</div>
                    <div class="info-value" id="server-version">—</div>
                </div>
            </div>

            <div class="motd-box" id="motd-box" style="display:none">
                <span id="motd-text"></span>
            </div>

            <div class="connect-section">
                <p class="connect-label">Connect with:</p>
                <div class="connect-address" id="connect-address">—</div>
                <button class="copy-btn" id="copy-btn" onclick="copyAddress()">📋 Copy</button>
            </div>

            <div class="server-controls">
                <button class="control-btn start-btn" id="start-btn" onclick="startServer()">▶ Start Server</button>
                <button class="control-btn stop-btn" id="stop-btn" onclick="stopServer()">⏹ Stop Server</button>
                <button class="control-btn log-btn" id="toggle-log-btn" onclick="toggleLogs()">📜 View Logs</button>
            </div>

            <div class="log-viewer" id="log-viewer" style="display: none;">
                <div class="log-header">
                    <span>Server Logs</span>
                    <button class="log-refresh-btn" onclick="fetchLogs()">↻</button>
                </div>
                <pre class="log-content" id="log-content">Loading logs...</pre>
            </div>
        </section>

        <section class="members-card">
            <h2 class="members-title">🌐 ZeroTier Members</h2>
            <ul class="members-list" id="members-list">
                <li class="member-placeholder">Loading...</li>
            </ul>
        </section>
        
        <footer>
            <p>Last updated: <span id="last-updated">—</span></p>
            <button class="refresh-btn" onclick="refresh()">↻ Refresh</button>
        </footer>
    </main>

    <script src="script.js?v=4"></script>
</body>

</html>
